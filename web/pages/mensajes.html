<div class="mensajes-container">

    <div class="mensaje-card">

                Asunto

                type="text"
                id="asuntoMensaje"

                maxlength="150"

        </div>

            <label for="textoMensaje">
                Mensaje
            </label>

            <textarea
                id="textoMensaje"

            <button
                type="button"
                id="btnBandejaEnviados"
                class="tab-mensaje"
            >
                Enviados
            </button>

        </div>

            id="listaMensajes"
            class="lista-mensajes"

            <div>

            </div>

            <div>
                <strong>Para:</strong>

            </div>

            <div>
                <strong>Fecha:</strong>

        </div>

            class="detalle-contenido"
        ></div>
