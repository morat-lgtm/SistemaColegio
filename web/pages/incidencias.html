<div class="modulo">


    <h1 class="titulo-modulo">
        📝 Registro de Incidencias
    </h1>





    <!-- ========================== -->
    <!-- BUSCAR ESTUDIANTE -->
    <!-- ========================== -->


    <section class="card incidencia-card">


        <h2>
            👨‍🎓 Buscar estudiante
        </h2>




        <div class="campo">


            <label>
                Estudiante
            </label>


            <input

            type="text"

            id="txtBuscarEstudianteIncidencia"

            placeholder="Escriba apellidos o nombres..."

            autocomplete="off"

            >


        </div>





        <div

        id="resultadoEstudianteIncidencia"

        class="resultado-estudiantes">

        </div>





        <div

        id="estudianteSeleccionadoIncidencia"

        class="seleccionado">

        </div>




    </section>









    <!-- ========================== -->
    <!-- BUSCAR INCIDENCIA -->
    <!-- ========================== -->


    <section class="card incidencia-card">


        <h2>
            ⚠ Seleccionar incidencia
        </h2>





        <div class="campo">


            <label>
                Tipo de incidencia
            </label>



            <input

            type="text"

            id="txtBuscarIncidencia"

            placeholder="Buscar incidencia..."

            autocomplete="off"

            >



        </div>






        <div

        id="resultadoTipoIncidencia"

        class="resultado-estudiantes">

        </div>






        <div

        id="incidenciaSeleccionada"

        class="seleccionado">

        </div>




    </section>









    <!-- ========================== -->
    <!-- DESCRIPCIÓN -->
    <!-- ========================== -->


    <section class="card incidencia-card">


        <h2>
            📝 Descripción adicional
        </h2>




        <textarea

        id="txtDescripcionIncidencia"

        placeholder="Describa detalles adicionales de la incidencia..."

        rows="5">


        </textarea>




    </section>









    <!-- ========================== -->
    <!-- BOTÓN -->
    <!-- ========================== -->


    <section class="card boton-card">


        <button

        id="btnRegistrarIncidencia"

        class="btn-principal">


            💾 Registrar incidencia


        </button>



    </section>




</div>
