        id="txtBuscarReporte"
        placeholder="Buscar estudiante..."

    <div
        id="listaEstudiantesReporte"

        id="btnExportarPDF"

    </button>

</section>



<!-- ========================== -->

<!-- ========================== -->

<section class="card">

    <h2>
        🏆 Ranking de estudiantes con más salidas

    </div>

</section>



<!-- ========================== -->
