<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGCE - Iniciar sesión</title>

    <link rel="stylesheet" href="assets/css/login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>SGCE</h1>

                <p>Sistema de Gestión y Comunicación Escolar</p>

            </div>


            <form id="formLogin">

                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        autofocus
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    id="btnIngresar"
                >
                    Ingresar
                </button>


                <div
                    id="mensaje"
                    class="mensaje"
                ></div>

            </form>

        </div>

    </div>


    <script src="assets/js/login.js"></script>

</body>

</html>
